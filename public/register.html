<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register | MyLibrary</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <nav class="navbar">
    <div class="nav-logo">📚 MyLibrary</div>
    <ul class="nav-menu">
      <li><a href="index.html">Home</a></li>
      <li><a href="login.html">Login</a></li>
      <li><a href="register.html" class="active">Register</a></li>
    </ul>
  </nav>

  <section class="auth-section gradient-blue">
    <div class="auth-container">
      <h2>Create an Account</h2>
      <form class="auth-form" method="POST" action="/register">
        <input type="text" placeholder="First Name" required />
        <input type="text" placeholder="Last Name" required />
        <input type="email" placeholder="Email" required />
        <select name="role" required>
            <option value="">Select Role</option>
            <option value="Student">Student</option>
            <option value="Faculty">Faculty</option>
            <option value="Librarian">Librarian</option>
        </select>
        <input type="password" placeholder="Password" required />
        <input type="password" placeholder="Confirm Password" required />
        <button type="submit" class="hero-btn">Register</button>
        <p class="switch-link">Already have an account? <a href="login.html">Login</a></p>
      </form>
    </div>
  </section>

  <footer>
    <p>&copy; 2025 MyLibrary</p>
  </footer>

  <script>
    const form = document.querySelector('.auth-form');
  
    form.addEventListener('submit', async (e) => {
        e.preventDefault();   
        console.log("Form submit triggered");
  
        const inputs = form.querySelectorAll('input');
        const firstName = inputs[0].value;
        const lastName = inputs[1].value;
        const email = inputs[2].value;
        const password = inputs[3].value;
        const confirm = inputs[4].value;
        const role = form.querySelector('select[name="role"]').value;
  
        if (password !== confirm) {
            return alert("Passwords don't match!");
      }
  
    try {
      console.log("Sending data to /register...");
      const res = await fetch('http://localhost:3000/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ firstName, lastName, email, password, role })
    });

    let data;
      try {
        data = await res.json();
      } catch (jsonErr) {
        console.error("Error parsing response JSON:", jsonErr);
        return alert("Unexpected server response.");
      }

      if (!res.ok) {
        return alert(data?.message || "Registration failed.");
      }

      alert(data.message);
      window.location.href = 'login.html';

    } catch (err) {
      console.error('Registration error:', err);
      alert('Something went wrong. Please check the console.');
    }
  });
  </script>
  
</body>
</html>
