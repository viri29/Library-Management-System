<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login | MyLibrary</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <nav class="navbar">
    <div class="nav-logo">📚 MyLibrary</div>
    <ul class="nav-menu">
      <li><a href="index.html">Home</a></li>
      <li><a href="login.html" class="active">Login</a></li>
      <li><a href="register.html">Register</a></li>
    </ul>
  </nav>

  <section class="auth-section gradient-pink">
    <div class="auth-container">
      <h2>Login to Your Account</h2>
      <form class="auth-form" method="POST" action="/login">
        <input type="email" name="email" placeholder="Email" required />
        <input type="password" name="password" placeholder="Password" required />
        <button type="submit" class="hero-btn">Login</button>
        <p class="switch-link">Don't have an account? <a href="register.html">Register</a></p>
      </form>
    </div>
  </section>

  <footer>
    <p>&copy; 2025 MyLibrary</p>
  </footer>

  <script>
    const form = document.querySelector('.auth-form');
  
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
  
      const inputs = form.querySelectorAll('input');
      const email = inputs[0].value;
      const password = inputs[1].value;
  
      try {
        console.log("Sending data to /login...");
        const res = await fetch('http://localhost:3000/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
      });

      let data;
      try {
        data = await res.json();
      } catch (jsonErr) {
        console.error("JSON parse error:", jsonErr);
        return alert("Unexpected server response.");
      }

      if (!res.ok) {
        return alert(data?.message || "Login failed.");
      }

      //redirect based on role
      alert(data.message);
      //save user session data
      localStorage.setItem("userId", data.userId);
      localStorage.setItem("role", data.role);

      //redirect logic
      const redirect = localStorage.getItem('redirectAfterLogin');
      if (redirect) {
        localStorage.removeItem('redirectAfterLogin');
        window.location.href = redirect;
      } else if (data.role === 'librarian') {
        window.location.href = 'librarian-dashboard.html';
      } else {
        window.location.href = 'index.html';
      }
      } catch (err) {
        console.error("Login error:", err);
        alert("Something went wrong. Please check the console.");
      }
  });
  </script>

</body>
</html>
