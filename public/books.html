<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Browse Books | MyLibrary</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <nav class="navbar">
    <div class="nav-logo">📚 MyLibrary</div>
    <ul class="nav-menu">
      <li><a href="index.html">Home</a></li>
      <li><a href="books.html" class="active">Books</a></li>
      <li><a href="borrowings.html">Borrowing History</a></li>
      <li><a href="reservations.html">Reservations</a></li>
      <li><a href="fines.html">Fines</a></li>
      <li><a href="account.html">Account</a></li>
      <li><a href="login.html" id="loginLink">Login</a></li>
      <li><a href="register.html" id="registerLink">Register</a></li>
      <li><a href="#" id="logoutLink" style="display: none;">Logout</a></li>
    </ul>
  </nav>

  <section class="sections">
    <h2>Explore Our Collection</h2>

    <input type="text" id="searchInput" placeholder="Search by Title, Author, or Category..." />

    <div class="book-grid" id="bookGrid">
      <!-- Book cards will be inserted here dynamically -->
    </div>
  </section>

  <footer>
    <p>&copy; 2025 MyLibrary</p>
  </footer>

  <script>
    //handle showing/hiding nav links based on login
    document.addEventListener('DOMContentLoaded', () => {
      const isLoggedIn = localStorage.getItem('userId');
      const loginLink = document.getElementById('loginLink');
      const registerLink = document.getElementById('registerLink');
      const logoutLink = document.getElementById('logoutLink');

      if (isLoggedIn) {
        loginLink.style.display = 'none';
        registerLink.style.display = 'none';
        logoutLink.style.display = 'inline-block';

        logoutLink.addEventListener('click', () => {
          localStorage.clear();
          window.location.href = 'login.html';
        });
      }
    });

    const searchInput = document.getElementById('searchInput');
    const bookGrid = document.getElementById('bookGrid');

    async function fetchBooks() {
      try {
        const res = await fetch('http://localhost:3000/books');        
        const books = await res.json();

        displayBooks(books);

        searchInput.addEventListener('input', () => {
          const keyword = searchInput.value.toLowerCase();
          const filtered = books.filter(book =>
            book.title.toLowerCase().includes(keyword) ||
            book.author.toLowerCase().includes(keyword) ||
            book.categoryName.toLowerCase().includes(keyword)
          );
          displayBooks(filtered);
        });

      } catch (error) {
        console.error('Error fetching books:', error);
      }
    }

    function displayBooks(books) {
      bookGrid.innerHTML = '';

      if (books.length === 0) {
        bookGrid.innerHTML = '<p>No books found.</p>';
        return;
      }

      books.forEach(book => {
        const card = document.createElement('div');
        card.className = 'book-card';
        card.innerHTML = `
        <div class="book-info">
          <h3>${book.title}</h3>
          <p><strong>Author:</strong> ${book.author}</p>
          <p><strong>Category:</strong> ${book.categoryName}</p>
          <p><strong>Published:</strong> ${book.publicationYear}</p>
          </div>
          <button class="hero-btn" onclick="reserveBook('${book.bookID}', '${book.title}')">Reserve</button>  
        `;
        bookGrid.appendChild(card);
      });
    }

    function reserveBook(bookID, title) {
      const userId = localStorage.getItem('userId');

      if (!userId) {
        alert("Please log in to reserve a book.");
        localStorage.setItem('redirectAfterLogin', 'books.html');
        window.location.href = 'login.html';
        return;
      }

      fetch('http://localhost:3000/reserve', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userID: userId, bookID })
      })
      .then(res => res.json())
      .then(data => {
        alert(data.message || `Reserved "${title}" successfully!`);
      })
      .catch(err => {
        console.error('Reservation error:', err);
        alert("Failed to reserve the book.");
      });
    }

    fetchBooks();
  </script>
</body>
</html>
